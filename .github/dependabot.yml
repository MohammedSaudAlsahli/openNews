version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
