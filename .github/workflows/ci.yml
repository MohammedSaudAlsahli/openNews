name: Editorial contracts and bundle
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12.13'
      - name: Contract and integration tests
        run: bash scripts/test.sh
      - name: Build and smoke-test embedded runtime
        run: bash scripts/build_app.sh
      - uses: actions/setup-node@v4
        if: hashFiles('desktop/package-lock.json') != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Tauri frontend contracts
        if: hashFiles('desktop/package-lock.json') != ''
        run: |
          npm --prefix desktop ci
          npm --prefix desktop test
          npm --prefix desktop run build
      - uses: actions/upload-artifact@v4
        with:
          name: development-evidence
          path: |
            build/bundle-sha256.json
            engine/eis_engine/provider_catalog.json
