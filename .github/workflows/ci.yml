name: openNews tests and Tauri bundle
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-path:
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop for official promotion
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SOURCE: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == pull_request && "$BASE" == main ]]; then
            [[ "$HEAD" == develop && "$SOURCE" == "$REPOSITORY" ]] || {
              echo 'Promote official releases from develop only.' >&2
              exit 1
            }
          fi
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Engine and frontend contracts
        run: bash scripts/test.sh
      - name: Frontend dependency advisories
        run: npm --prefix desktop audit --audit-level=high
      - name: Build standalone Tauri app
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            bash scripts/build_app.sh --release
          else
            bash scripts/build_app.sh --development
          fi
      - name: Native bridge and embedded runtime tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Verify relocated bundle and archive release
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            engine/.venv/bin/python scripts/archive_tauri.py
          else
            engine/.venv/bin/python scripts/archive_tauri.py --development
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'openNews-macOS-arm64' || 'openNews-Dev-macOS-arm64' }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
