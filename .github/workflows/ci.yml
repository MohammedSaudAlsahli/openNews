name: openNews tests and Tauri bundle
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Engine and frontend contracts
        run: bash scripts/test.sh
      - name: Frontend dependency advisories
        run: npm --prefix desktop audit --audit-level=high
      - name: Build standalone Tauri app
        run: bash scripts/build_app.sh
      - name: Native bridge and embedded runtime tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Verify relocated bundle and archive release
        run: engine/.venv/bin/python scripts/archive_tauri.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openNews-macOS-arm64
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
