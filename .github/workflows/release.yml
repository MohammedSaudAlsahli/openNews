name: Publish official Tauri release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stable tag (v0.3.0)
        required: true
        type: string
      run_id:
        description: Successful main/push CI run for the tagged commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: official-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate CI identity, checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: python scripts/publish_tauri_release.py --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID"
