name: Publish official Tauri release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stable tag (v0.3.0)
        required: true
        type: string
      run_id:
        description: Successful main/push CI run for the tagged commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: official-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate CI identity, checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: python scripts/publish_tauri_release.py --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID"
