[package]
name = "openstudio-desktop"
version = "0.3.0-preview.1"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
libc = "0.2"
base64 = "0.22"
url = "2"
